name: CI/CD

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: dichthat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build app
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve bundle version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must match vX.Y.Z." >&2
              exit 1
            fi
            echo "DICHTHAT_VERSION=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"
          else
            echo "DICHTHAT_VERSION=0.0.0" >> "${GITHUB_ENV}"
          fi
          echo "DICHTHAT_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "${GITHUB_ENV}"

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: bash scripts/build-app.sh

      - name: Verify app bundle
        run: bash scripts/verify-app.sh

      - name: Archive app bundle
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            /private/tmp/dichthat-app/DichThat.app \
            dist/DichThat-app.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: DichThat-App-${{ github.sha }}
          path: dist/DichThat-app.zip
          if-no-files-found: error
          retention-days: 7

  package:
    name: Build DMG
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DICHTHAT_REQUIRE_STABLE_SIGNING: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z." >&2
            exit 1
          fi
          echo "DICHTHAT_VERSION=${tag_version}" >> "${GITHUB_ENV}"
          echo "DICHTHAT_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "${GITHUB_ENV}"

      - name: Import release signing certificate
        timeout-minutes: 3
        env:
          DICHTHAT_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.DICHTHAT_SIGNING_CERTIFICATE_P12_BASE64 }}
          DICHTHAT_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.DICHTHAT_SIGNING_CERTIFICATE_PASSWORD }}
        run: bash scripts/import-signing-certificate.sh

      - name: Build and verify DMG
        run: bash scripts/build-dmg.sh

      - name: Validate Sparkle signing secret
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          if [[ -z "${SPARKLE_EDDSA_PRIVATE_KEY}" ]]; then
            echo "Missing SPARKLE_EDDSA_PRIVATE_KEY repository secret." >&2
            exit 1
          fi

      - name: Build signed Sparkle update
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: bash scripts/build-update.sh

      - name: Verify release artifacts
        run: |
          bash scripts/verify-release.sh \
            "dist/DichThat.dmg" \
            "dist/DichThat-${DICHTHAT_VERSION}.zip" \
            "dist/appcast.xml"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: DichThat-Release-${{ github.ref_name }}
          path: |
            dist/DichThat.dmg
            dist/*.zip
            dist/appcast.xml
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/DichThat.dmg
            dist/*.zip
            dist/appcast.xml
          generate_release_notes: true

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -n "${DICHTHAT_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "${DICHTHAT_SIGNING_KEYCHAIN}" || true
          fi
