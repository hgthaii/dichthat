name: CI/CD

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: dichthat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build app
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: bash scripts/build-app.sh

      - name: Verify app bundle
        run: bash scripts/verify-app.sh

      - name: Archive app bundle
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            /private/tmp/dichthat-app/DichThat.app \
            dist/DichThat-app.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: DichThat-App-${{ github.sha }}
          path: dist/DichThat-app.zip
          if-no-files-found: error
          retention-days: 7

  package:
    name: Build DMG
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "${tag_version}" != "${app_version}" ]]; then
            echo "Tag v${tag_version} does not match app version ${app_version}." >&2
            exit 1
          fi

      - name: Build and verify DMG
        run: bash scripts/build-dmg.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: DichThat-DMG
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.dmg
          generate_release_notes: true
