name: Bug report
description: Report reproducible behavior that is not working as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include selected text, clipboard contents, translation content, credentials, or other personal data.

  - type: input
    id: app-version
    attributes:
      label: DichThat version
      placeholder: "For example: 1.0.0"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version and Mac model
      placeholder: "For example: macOS 26.0, MacBook Pro with Apple silicon"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem without including private content.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Add logs or screenshots only after removing personal and translated content.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed selected text, clipboard contents, translation content, credentials, and other personal data.
          required: true
